apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-st
  namespace: shop
  labels:
    app.kubernetes.io/name: &name redis-st
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance redis-st
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/instance: *instance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/instance: *instance
    spec:
      containers:
      - name: redis-db
        image: redis:8-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis-port
        volumeMounts:
            - name: data
              mountPath: /data       
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
          
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5 
          
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi