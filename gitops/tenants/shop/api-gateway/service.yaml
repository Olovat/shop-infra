apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shop
  labels:
    app.kubernetes.io/name:  api-gateway
    app.kubernetes.io/instance: api-gateway
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http