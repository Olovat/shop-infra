apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: api-gateway
    namespace: shop
    labels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: api-gateway
      app.kubernetes.io/component: ingress
spec:
  ingressClassName: traefik
  rules:
    - host: shop.tail2f17e5.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http