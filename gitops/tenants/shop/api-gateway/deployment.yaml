apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shop
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: v0.0.1
    app.kubernetes.io/instance: api-gateway
spec: 
  replicas: 1
  selector:
    matchLabels: 
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/version: af9f218848ee8632fa20b46d1bcec83706e22705
        app.kubernetes.io/instance: api-gateway
    spec:
      initContainers:
        - name: wait-upstreams
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - for hp in auth-service:44044 product-service:8081; do h=${hp%:*}; p=${hp#*:}; until nc -z -w 2 "$h" "$p"; do echo "waiting $hp"; sleep 2; done; done
      volumes:
        - name: config-volume
          configMap:
            name: api-gateway-config
      containers:
       - name: api-gateway
         image: ghcr.io/eternity8c/shop-api-gateway:af9f218848ee8632fa20b46d1bcec83706e22705
         ports:
         - containerPort: 8080
           name: http
           protocol: TCP
         volumeMounts:
          - name: config-volume
            mountPath: /app/configs
            readOnly: true
         env:
          - name: CONFIG_PATH
            value: ./configs/.env
         resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
            cpu: 100m
         readinessProbe:
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
         livenessProbe:
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
