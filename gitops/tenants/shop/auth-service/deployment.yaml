apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shop
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/version: v0.0.1
    app.kubernetes.io/instance: auth-service
spec: 
  replicas: 1
  selector:
    matchLabels: 
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/instance: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/version: af9f218848ee8632fa20b46d1bcec83706e22705
        app.kubernetes.io/instance: auth-service
    spec:
      initContainers:
        - name: build-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - set -eu; cat /common/.env > /merged/.env; printf "\n" >> /merged/.env; cat /secret/.env >> /merged/.env; test -s /merged/.env
          volumeMounts:
            - name: common-config
              mountPath: /common
            - name: secret-config
              mountPath: /secret
            - name: merged-config
              mountPath: /merged
      volumes:
           - name: common-config
             configMap:
               name: auth-service-config
           - name: secret-config
             secret:
               secretName: auth-service-secret
           - name: merged-config
             emptyDir: {}
      containers:
       - name: auth-service
         image: ghcr.io/eternity8c/shop-auth-service:af9f218848ee8632fa20b46d1bcec83706e22705
         ports:
         - containerPort: 44044
           name: grpc
           protocol: TCP
         volumeMounts:
          - name: merged-config
            mountPath: /app/configs
            readOnly: true
         env:
          - name: CONFIG_PATH
            value: ./configs/.env
         resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
            cpu: 100m

