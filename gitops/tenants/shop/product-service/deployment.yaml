apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/version: v0.0.1
    app.kubernetes.io/instance: product-service
spec: 
  replicas: 1
  selector:
    matchLabels: 
        app.kubernetes.io/name: product-service
        app.kubernetes.io/instance: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/version: 28bdd94131c2783275803fc0f20e5d4e99312a11
        app.kubernetes.io/instance: product-service
    spec:
      initContainers:
      - name: build-config
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
          - cat /common/.env /secret/.env > /merged/.env
        volumeMounts:
          - name: common-config
            mountPath: /common
          - name: secret-config
            mountPath: /secret
          - name: merged-config
            mountPath: /merged
      volumes:
      - name: common-config
        configMap:
          name: product-service-config
      - name: secret-config
        secret:
          secretName: product-service-secret
      - name: merged-config
        emptyDir: {}
      containers:
       - name: product-service
         image: ghcr.io/eternity8c/shop-product-service:28bdd94131c2783275803fc0f20e5d4e99312a11
         ports:
         - containerPort: 8081
           name: http
           protocol: TCP
         volumeMounts:
          - name: merged-config
            mountPath: /app/configs
            readOnly: true
        
         env:
          - name: CONFIG_PATH
            value: ./configs/.env
         resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi