apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-st
  namespace: shop
  labels:
    app.kubernetes.io/name: &name postgresql-st
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance postgresql-st
spec:
  serviceName: "postgresql-svc"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/instance: *instance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/instance: *instance
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: postgres-init
      containers:
      - name: postgresql-db
        image: postgres:16-alpine3.23
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_USER
            value: admin
        ports:
        - containerPort: 5432
          name: postgre-port
        volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data       
            - name: config-volume
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
          
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - -e
            - |
              exec pg_isready -U "admin" -h 127.0.0.1 -p 5432
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5 
          


  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi